# Local dev Postgres — mirrors Neon (prod) closely enough for migrations.
# Usage: docker compose up -d postgres
services:
  postgres:
    # 18-alpine, and the major matters here (#1385 review r1): this container is the
    # scratch server the documented restore drill restores INTO. pg_dump 18 writes custom
    # archive format 1.16, and a 16.x pg_restore refuses to read it — so a drill run
    # against a 16 server would fail on a dump that is perfectly good, or (worse) pass
    # only because the drill dumped with the same old local binaries it restored with.
    # Keep this at or above the major the nightly backup is taken with
    # (apps/worker/Dockerfile pins postgresql-client-18).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fikirtive
      POSTGRES_PASSWORD: fikirtive
      POSTGRES_DB: fikirtive
    ports:
      - "5432:5432"
    volumes:
      # Renamed from artlio-pg (2026-07-07 name purge). Postgres only creates the
      # user/db on FIRST init, so the rename ships with a fresh volume; the old
      # artlio-pg volume (and its data) survives untouched — `docker volume ls`.
      #
      # MOUNT POINT MOVED WITH THE IMAGE (#1385 review r2). postgres:18 relocated its data
      # directory: upstream's Dockerfile now sets `PGDATA=/var/lib/postgresql/18/docker`
      # and declares `VOLUME /var/lib/postgresql` (it was /var/lib/postgresql/data through
      # 17). Leaving the old `:/var/lib/postgresql/data` mount behind would not error — it
      # would just stop being PGDATA: initdb would write the real cluster into an ANONYMOUS
      # volume, so every `docker compose down`/`up` would silently hand you an empty
      # database. We mount the image's own declared VOLUME rather than pinning PGDATA back
      # to the old path, because that is the layout upstream maintains: each major gets its
      # own subdirectory inside this one volume, so the next bump needs no change here, and
      # nothing anonymous is created behind our backs.
      #
      # ⚠️ A `fikirtive-pg` volume initialised under Postgres 16 CANNOT be read by 18 — the
      # data directory format is major-specific. This is a throwaway dev/drill database, so
      # the fix is to recreate it, NOT to attempt an upgrade:
      #     docker compose down && docker volume rm fikirtive-pg && docker compose up -d postgres
      # (Your old 16 data is orphaned, not deleted, until you run that `volume rm`.)
      - fikirtive-pg:/var/lib/postgresql

  # R2 stand-in for local r2-driver verification (S3-compatible).
  # Usage: docker compose up -d minio, then run web/worker with STORAGE_DRIVER=r2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  fikirtive-pg:
  minio-data:
