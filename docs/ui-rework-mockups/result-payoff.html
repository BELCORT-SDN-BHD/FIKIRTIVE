<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Geist','Inter',system-ui,sans-serif;color:#0A0A0A;background:#FCFCFC;-webkit-font-smoothing:antialiased;padding:40px;}
  .wrap{max-width:880px;margin:0 auto;position:relative;}
  .confetti{position:absolute;top:-20px;left:0;right:0;height:260px;pointer-events:none;}
  .cf{position:absolute;}
  .glow{position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:560px;height:240px;background:radial-gradient(closest-side,rgba(236,88,40,.10),rgba(236,88,40,0));pointer-events:none;}
  .head{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:26px;}
  .burst{width:60px;height:60px;border-radius:18px;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(22,163,74,.30);}
  h1{font-size:42px;font-weight:700;letter-spacing:-0.035em;color:#0A0A0A;line-height:1.04;}
  .sub{font-size:17px;color:#76766F;max-width:520px;}
  .ottobubble{display:inline-flex;align-items:center;gap:10px;background:#FFF3EE;border:1px solid #FBD9C9;border-radius:14px;padding:10px 15px;margin-top:4px;}
  .ottobubble .tx{font-size:14.5px;font-weight:500;color:#9A3A1A;}
  .gallery{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .tile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:#ECECEA;border:1px solid #EAEAE8;}
  .tile.pick{border:2px solid #EC5828;box-shadow:0 8px 22px rgba(236,88,40,.20);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .ov{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));}
  .tile .ovt{color:#fff;font-size:13px;font-weight:600;}
  .tile .ovs{color:rgba(255,255,255,.85);font-size:11px;font-weight:500;}
  .tile .chip{position:absolute;top:9px;left:9px;background:rgba(255,255,255,.92);color:#0A0A0A;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;}
  .tile .pickchip{position:absolute;top:9px;right:9px;background:#EC5828;color:#fff;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
  .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .btn{height:48px;padding:0 20px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;}
  .btn-primary{background:#0A0A0A;color:#fff;}
  .btn-secondary{background:#fff;color:#0A0A0A;border-color:#E2E2DF;}
  .btn-otto{background:#FBE4D8;color:#9A3A1A;border-color:#F7C9B5;}
  .ic{width:18px;height:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="confetti">
    <span class="cf" style="top:8px;left:12%;width:9px;height:9px;background:#EC5828;border-radius:2px;transform:rotate(20deg)"></span>
    <span class="cf" style="top:30px;left:22%;width:7px;height:7px;background:#16A34A;border-radius:50%"></span>
    <span class="cf" style="top:0;left:33%;width:8px;height:14px;background:#3B6FE6;border-radius:2px;transform:rotate(-18deg)"></span>
    <span class="cf" style="top:54px;left:8%;width:8px;height:8px;background:#D97706;border-radius:50%"></span>
    <span class="cf" style="top:18px;left:46%;width:7px;height:7px;background:#14B8A6;border-radius:2px;transform:rotate(35deg)"></span>
    <span class="cf" style="top:70px;left:30%;width:6px;height:6px;background:#EC5828;border-radius:50%"></span>
    <span class="cf" style="top:6px;left:62%;width:8px;height:13px;background:#16A34A;border-radius:2px;transform:rotate(24deg)"></span>
    <span class="cf" style="top:40px;left:74%;width:9px;height:9px;background:#3B6FE6;border-radius:2px;transform:rotate(-30deg)"></span>
    <span class="cf" style="top:14px;left:84%;width:7px;height:7px;background:#D97706;border-radius:50%"></span>
    <span class="cf" style="top:62px;left:90%;width:8px;height:8px;background:#EC5828;border-radius:2px;transform:rotate(15deg)"></span>
    <span class="cf" style="top:96px;left:16%;width:7px;height:7px;background:#3B6FE6;border-radius:50%"></span>
    <span class="cf" style="top:104px;left:80%;width:8px;height:12px;background:#14B8A6;border-radius:2px;transform:rotate(-22deg)"></span>
    <span class="cf" style="top:2px;left:50%;width:6px;height:6px;background:#D97706;border-radius:50%"></span>
    <span class="cf" style="top:88px;left:55%;width:7px;height:7px;background:#16A34A;border-radius:2px;transform:rotate(40deg)"></span>
    <span class="cf" style="top:46px;left:38%;width:6px;height:6px;background:#3B6FE6;border-radius:50%"></span>
    <span class="cf" style="top:120px;left:68%;width:7px;height:7px;background:#EC5828;border-radius:50%"></span>
  </div>
  <div class="glow"></div>
  <div class="head">
    <span class="burst"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1>Boom. Your campaign is ready.</h1>
    <p class="sub">6 on-brand assets, made from one photo. Take a look, then post or tweak anything.</p>
    <span class="ottobubble">
      <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><defs><linearGradient id="ob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4793F"/><stop offset="1" stop-color="#DD481A"/></linearGradient></defs><rect x="6" y="12" width="36" height="29" rx="11" fill="url(#ob)"/><rect x="12.5" y="18.5" width="23" height="15.5" rx="7" fill="#0A0A0A"/><ellipse cx="20.5" cy="25" rx="2.4" ry="3" fill="#FFF6EE"/><ellipse cx="27.5" cy="25" rx="2.4" ry="3" fill="#FFF6EE"/><circle cx="21.2" cy="26.4" r="1.15" fill="#0A0A0A"/><circle cx="28.2" cy="26.4" r="1.15" fill="#0A0A0A"/></svg>
      <span class="tx">Done! I starred my favourite. Want me to make 3 more like it?</span>
    </span>
  </div>

  <div class="gallery">
    <div class="tile pick"><span class="pickchip"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6z"/></svg>OTTO's pick</span><img src="https://picsum.photos/seed/fkbake1/360/480" alt="Generated ad creative"/><div class="ov"><div class="ovt">Fresh every morning</div><div class="ovs">Petit Pain Bakery</div></div></div>
    <div class="tile"><span class="chip">9:16</span><img src="https://picsum.photos/seed/fkbake7/360/480" alt="Generated ad creative"/></div>
    <div class="tile"><span class="chip">9:16</span><img src="https://picsum.photos/seed/fkbake3/360/480" alt="Generated ad creative"/><div class="ov"><div class="ovt">Autumn menu is here</div><div class="ovs">Order now</div></div></div>
    <div class="tile"><span class="chip">9:16</span><img src="https://picsum.photos/seed/fkbake9/360/480" alt="Generated ad creative"/></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download all</button>
    <button class="btn btn-secondary"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>Post to Instagram</button>
    <button class="btn btn-otto"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10z"/></svg>Make 3 more like this</button>
  </div>
</div>
</body>
</html>
