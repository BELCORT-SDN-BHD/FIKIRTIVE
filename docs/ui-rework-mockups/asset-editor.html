<!-- @dsCard group="Canvas (app)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Geist',system-ui,sans-serif;color:#0A0A0A;-webkit-font-smoothing:antialiased;}
  .scrim{min-height:100vh;background:rgba(10,10,12,.45);display:flex;align-items:center;justify-content:center;padding:30px;
    background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px;}
  .modal{width:min(940px,100%);background:#FCFCFC;border:1px solid #E6E6E3;border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.35);display:flex;overflow:hidden;}
  /* left: asset */
  .left{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;gap:14px;background:#F8F8F7;}
  .stage{flex:1;border-radius:14px;overflow:hidden;background:#ECECEA;display:flex;align-items:center;justify-content:center;position:relative;}
  .stage img{width:100%;height:100%;object-fit:cover;}
  .stagechip{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#fff;background:#EC5828;padding:4px 10px;border-radius:999px;}
  .vars{display:flex;gap:9px;}
  .var{width:62px;height:62px;border-radius:10px;overflow:hidden;border:1px solid #E2E2DF;cursor:pointer;}
  .var.on{border:2px solid #EC5828;}
  .var img{width:100%;height:100%;object-fit:cover;}
  .varadd{width:62px;height:62px;border-radius:10px;border:1.5px dashed #CFCFC8;display:flex;align-items:center;justify-content:center;color:#9A9A98;cursor:pointer;}
  /* right: controls */
  .right{width:344px;flex:none;border-left:1px solid #EAEAE8;background:#fff;display:flex;flex-direction:column;}
  .rhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #F0F0EE;}
  .rhead .tt{font-size:16px;font-weight:600;flex:1;}
  .rhead .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9A9A98;}
  .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#76766F;cursor:pointer;}
  .rbody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px;}
  .sec{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#A6A6A0;}
  .bigbtns{display:flex;flex-direction:column;gap:8px;}
  .bb{height:44px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .bb.ink{background:#0A0A0A;color:#fff;} .bb.soft{background:#FBE4D8;color:#9A3A1A;}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tool{display:flex;align-items:center;gap:8px;height:40px;border:1px solid #E6E6E3;border-radius:11px;padding:0 12px;font-size:13px;font-weight:600;color:#2A2A28;cursor:pointer;}
  .tool svg{width:16px;height:16px;color:#76766F;}
  .seg{display:flex;background:#EFEFED;border-radius:10px;padding:3px;}
  .seg span{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:#86867F;padding:6px;border-radius:8px;cursor:pointer;}
  .seg .on{background:#fff;color:#0A0A0A;box-shadow:0 1px 2px rgba(20,20,24,.08);}
  .icons{display:flex;gap:8px;}
  .ib{flex:1;height:38px;border:1px solid #E6E6E3;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#3A3A38;cursor:pointer;}
  .ib.fav{color:#EC5828;border-color:#F7C9B5;background:#FFF6F2;}
  /* OTTO composer */
  .otto{border-top:1px solid #F0F0EE;padding:13px 16px;background:#FFFCFB;}
  .ottohint{display:flex;align-items:center;gap:7px;font-size:12px;color:#9A3A1A;margin-bottom:8px;font-weight:500;}
  .cbox{display:flex;align-items:center;gap:8px;border:1.5px solid #E2E2DF;border-radius:12px;padding:5px 5px 5px 12px;background:#fff;}
  .cbox input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:transparent;}
  .cbox input::placeholder{color:#A6A6A0;}
  .cs{width:32px;height:32px;border-radius:9px;background:#0A0A0A;color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cost{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9A9A98;margin-top:7px;text-align:right;}
</style>
</head>
<body>
<div class="scrim">
  <div class="modal">
    <div class="left">
      <div class="stage"><span class="stagechip"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6z"/></svg>OTTO's pick</span><img src="https://picsum.photos/seed/ae-main/720/540"/></div>
      <div class="vars">
        <div class="var on"><img src="https://picsum.photos/seed/aev1/120/120"/></div>
        <div class="var"><img src="https://picsum.photos/seed/aev2/120/120"/></div>
        <div class="var"><img src="https://picsum.photos/seed/aev3/120/120"/></div>
        <div class="var"><img src="https://picsum.photos/seed/aev4/120/120"/></div>
        <div class="varadd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
    </div>
    <div class="right">
      <div class="rhead"><div><div class="tt">Image</div><div class="meta">1:1 · 1024² · 1 credit</div></div><div style="flex:1"></div><div class="x"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
      <div class="rbody">
        <div class="bigbtns">
          <button class="bb ink"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>Animate into video</button>
          <button class="bb soft"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10z"/></svg>Make 3 variations</button>
        </div>
        <div>
          <div class="sec" style="margin-bottom:8px">Edit</div>
          <div class="grid4">
            <div class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>Crop</div>
            <div class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 16v3a2 2 0 0 0 2 2h3M16 3h3a2 2 0 0 1 2 2v3M21 8V5a2 2 0 0 0-2-2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>Upscale</div>
            <div class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12H3M21 12l-4-4M21 12l-4 4M3 5v14"/></svg>Extend</div>
            <div class="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Regenerate</div>
          </div>
        </div>
        <div>
          <div class="sec" style="margin-bottom:8px">Aspect ratio</div>
          <div class="seg"><span class="on">1:1</span><span>9:16</span><span>16:9</span><span>4:5</span></div>
        </div>
        <div class="icons">
          <div class="ib fav"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.4-9.5-8.5C1 9.5 2.5 6 6 6c2 0 3.2 1.2 4 2.3C10.8 7.2 12 6 14 6c3.5 0 5 3.5 3.5 6.5C19 16.6 12 21 12 21z"/></svg></div>
          <div class="ib"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></div>
          <div class="ib"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/></svg></div>
          <div class="ib"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
        </div>
      </div>
      <div class="otto">
        <div class="ottohint"><svg width="16" height="15" viewBox="0 0 120 110" aria-hidden="true"><g fill="#EC5828"><ellipse cx="60" cy="64" rx="43" ry="22"/><circle cx="37" cy="52" r="18"/><circle cx="61" cy="40" r="24"/><circle cx="85" cy="53" r="17"/></g><rect x="51" y="48" width="7" height="13" rx="3.5" fill="#2B1308"/><rect x="66" y="48" width="7" height="13" rx="3.5" fill="#2B1308"/></svg>Ask OTTO to change this</div>
        <div class="cbox"><input placeholder="e.g. warmer background, add our logo…"/><button class="cs"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button></div>
        <div class="cost">≈ 1 credit · billed only if it finishes</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
