# F36 — the FIRST automated gate for this repo. Pushing to main auto-deploys web + worker to
# Railway and auto-migrates prod, with no human gate in between, so a bad merge ships instantly.
# This runs on every PR and on push to main.
#
# NOTE: real branch protection is unavailable (private repo, free plan — founder chose not to
# upgrade). The enforcement is the merge discipline in .claude/CLAUDE.md: PRs only, ALL checks
# green before merge. This workflow reports status; agents are bound by the discipline.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + fences + frozen lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` field — action-setup@v4
      # errors if `version` is ALSO set here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile moves the #68 class of failure (a package.json dep added without
      # regenerating pnpm-lock.yaml) from deploy-time to PR-time.
      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve from dist, so build them (tsc-only — cheap) before
      # typechecking the apps. db's build script runs `prisma generate` itself. The apps are
      # deliberately NOT built here: `next build` is expensive and env-dependent.
      - run: pnpm --filter "./packages/*" build
      - run: pnpm -r typecheck
      # Hard spend-fence: skills must not import the fal provider / reserveCredits directly.
      - run: bash scripts/check-skill-imports.sh
      # Tenancy tripwire (informational baseline today; never fails the build yet).
      - run: bash scripts/check-no-raw-prisma.sh
      # Skill catalog must match the registry (Seam 1 step 5) — a stale CATALOG.md fails here.
      - run: pnpm --filter @fikirtive/otto run catalog:check

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artlio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Database name ends in _test — required by the packages/db and apps/web (F35) guards.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/artlio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager` (see check job)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same as the check job: tests import @fikirtive/* from dist (see comment above).
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @fikirtive/db exec prisma migrate deploy
      - run: pnpm -r test
