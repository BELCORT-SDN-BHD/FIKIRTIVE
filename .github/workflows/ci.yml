name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# `pull-requests: read` is for the docs-only scope check below (it lists the PR's files).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    # The `quality` context is the required status check in the protect-main ruleset
    # (bypass_actors is empty — nobody can merge around it). Renaming this job, or letting
    # it be skipped, freezes every merge in the repository. Speed work goes INSIDE the job.
    name: quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fikirtive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `next build` re-runs a TypeScript pass in a child worker, and that worker had grown to
      # the ~2 GB default heap: it now OOMs on a coin flip, independently of what a PR changed
      # (measured: this PR's own diff adds 11 MB to a 1,088 MB `tsc` run — under 1%). Raising the
      # ceiling weakens no gate; the check still runs, and `pnpm -r typecheck` runs before it.
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fikirtive_test
      BETTER_AUTH_SECRET: fikirtive-ci-only-session-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: fikirtive-ci-only-google-client
      GOOGLE_CLIENT_SECRET: fikirtive-ci-only-google-secret
    steps:
      - uses: actions/checkout@v4

      # Docs-only PRs have nothing for these gates to check. This is deliberately NOT a
      # workflow-level `paths-ignore`: a workflow skipped by a path filter never posts its
      # check, and `quality` is required — a docs-only PR would sit unmergeable forever.
      # Deciding inside the job means `quality` still reports on every PR, it just finishes
      # in seconds. Fail-safe: anything unexpected (API error, empty list) runs the full gate.
      #
      # The decision itself lives in scripts/ci/pr-scope.sh so it can be tested — it is
      # covered by scripts/__tests__/pr-scope.test.sh, which `quality` runs. This step only
      # fetches the list and forwards the answer, and it only ever accepts a literal
      # "false" as permission to skip.
      - name: Scope — does this PR touch anything outside docs/?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          changed="${RUNNER_TEMP:-/tmp}/pr-changed-files.txt"
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' >"$changed" 2>/dev/null || : >"$changed"
          if [ ! -s "$changed" ]; then
            echo "could not list the PR's files — running every gate"
          else
            echo "changed files:"
            cat "$changed"
          fi
          code="$(bash scripts/ci/pr-scope.sh "$changed")" || code=true
          [ "$code" = "false" ] || code=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then
            echo "docs/** only — every gate below is a no-op for this diff"
          fi

      - if: steps.scope.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # TypeScript's incremental state, for both TS passes `quality` runs over apps/web:
      # `tsc --noEmit` (apps/web/tsconfig.tsbuildinfo) and the one inside `next build`
      # (.next/cache/.tsbuildinfo). tsc re-checks any file whose hash moved plus everything
      # downstream of it, so a cache restored from another commit weakens nothing — it only
      # skips re-deriving types for files that did not change. ~1 MB, so the restore is
      # nearly free. The `github.sha` suffix makes every run save a fresh entry; the
      # restore-keys are what actually load one.
      #
      # Measured on this PR, so nobody has to guess: the saving tracks how much of the diff
      # the restored state still covers. Restoring across a large diff bought nothing
      # (typecheck 86s → 86s); restoring across a one-comment diff cut typecheck 86s → 49s.
      # `next build` did not move either way (98s both). So expect real savings on push-after-
      # push of the same branch, and none on the first run of a fresh branch.
      - name: Restore TypeScript / Next build cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/web/tsconfig.tsbuildinfo
          key: build-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
            build-${{ runner.os }}-node22-

      - if: steps.scope.outputs.code == 'true'
        run: pnpm quality
