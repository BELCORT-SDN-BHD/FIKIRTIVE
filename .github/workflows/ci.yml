# The five CI jobs and the local fallback share scripts/ci/run-job.sh as their only command
# source. Deployment is Founder-only; external source triggers and the deployed commit must be
# queried live rather than inferred from this workflow.
name: CI

on:
  pull_request:
    # `edited` re-runs this job (and the other four) on a title/body/base edit too, which is
    # useful general responsiveness but is NOT load-bearing for scripts/ci/check-money-path-
    # review.mjs specifically (#480 round 3): the review token now lives in a PR COMMENT, verified
    # with a LIVE GitHub API call on every run, not read out of the cached event payload — so an
    # ordinary re-run (a new push, or a plain "Re-run jobs" click that replays the old payload)
    # already picks up a comment posted at any point before that run, no special trigger needed.
    #
    # What `edited` still costs, stated in full:
    #   * GitHub fires `edited` for a TITLE or BASE-BRANCH change too, not only the body, so all
    #     five jobs re-run on edits that cannot possibly affect the build.
    #   * `concurrency.cancel-in-progress` below groups by github.ref, so an edit shortly after a
    #     push CANCELS the push-triggered run. A cancelled run is not green, and project law
    #     clause 2 requires every current-head check to be green — read the LATEST run for the
    #     head SHA, and re-run the cancelled one if a reviewer needs it green too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + fences + frozen lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` field — action-setup@v4
      # errors if `version` is ALSO set here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci/run-job.sh check

  # `next build` for apps/web — the exact command Railway's Dockerfile runs on deploy.
  # Typecheck can't catch client→server-bundle leaks (a "use client" file value-importing
  # @fikirtive/otto or another server-only module drags prisma/pg into the browser bundle);
  # that class of bug merged green twice (#33, and the otto-in-client leak found 2026-07-02)
  # and only exploded at deploy time. Needs NO env vars: every route is dynamic (ƒ) and all
  # process.env reads sit behind lazy getters, so nothing connects to a DB at build time.
  # If a build ever starts demanding an env var, prefer making the read lazy over adding a
  # stub here — a build-time env dependency would also break Railway builds.
  web-build:
    name: next build (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager` (see check job)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci/run-job.sh web-build

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fikirtive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Database name ends in _test — required by the packages/db and apps/web (F35) guards.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fikirtive_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager` (see check job)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci/run-job.sh test

  # ESLint remains a separate hard job because its output-heavy failure mode is distinct from the
  # typecheck/fence job. The shared runner builds workspace packages first; no DB or web build is
  # required here. Do not hide regressions with eslint-disable.
  lint:
    name: eslint (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager` (see check job)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/ci/run-job.sh lint

  # Lock 3 (#480, extracted from the #471 archive) — a diff that can move money does not merge
  # without a named review. Fail-closed on a pull_request event with an unstamped money-path
  # file; advisory (never blocks) on `push` to main or any run without PR context, since the
  # skill's Step-1 catch-all and the human `git diff` at review time still cover that case.
  # This job is NOT wired into required-status-check settings here — that is a repository
  # setting change and stays Founder-only (project law clause 6 / issue #480's own gate).
  #
  # GITHUB_TOKEN (#480 round 3, sealed cross-family judge P1 "凭证署名不认证可伪造"): the
  # review token must now come from a PR COMMENT authored by someone other than the PR author,
  # verified with a live call to the GitHub REST API — a PR-body self-declaration is no longer
  # accepted at all. This is NOT a new credential grant: GITHUB_TOKEN is the ephemeral,
  # automatically-issued per-run token every Actions job already has; passing it through as an
  # env var only lets the script make the SAME read-only issues-comments call `gh`/`actions/
  # github-script` could already make with this job's existing default permissions. No
  # `permissions:` block is added here — whatever the repo's default token scope is (a repo
  # setting, Founder-only to change) already covers a read call on issue comments.
  money-path-review:
    name: money-path review (spend-path gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager` (see check job)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/run-job.sh money-path-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
