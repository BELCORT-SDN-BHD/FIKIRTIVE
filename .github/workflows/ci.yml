name: CI

# THE SHAPE OF THIS FILE, IN ONE PARAGRAPH. `quality` used to be one job that ran
# five kinds of check one after another, so its wall clock was their SUM (~18 min).
# It is now five jobs that run the same checks at the same time on five ephemeral
# VMs, plus a fan-in job — still named `quality`, still the required check — that
# passes only when every leg passed. The wall clock is the SLOWEST leg, not the
# sum. Nothing about what is checked changed: the legs are `scripts/ci/quality.sh
# --leg <name>`, the same script, and its default (no --leg) still runs every gate
# in the same order, which is what `pnpm quality` on a laptop does.
#
# Two invariants hold the whole thing up, and both are machine-checked by
# scripts/__tests__/quality-legs.test.sh (which runs inside the `typecheck` leg):
#   - the union of the legs is the entire gate list, so nothing stopped running
#   - this file launches exactly the legs quality.sh declares, and the fan-in job
#     is still called `quality`, byte for byte
# The third invariant lives in the fan-in job below: it fails closed on anything
# that is not an explicit, expected success.
#
# ── THE TRIPWIRE, AND WHAT IT IS HONESTLY FOR ────────────────────────────────
# Everything above runs INSIDE `pnpm quality --leg typecheck`. Review of #874 r6
# pointed out the hole that makes it: put `npm_config_script_shell=/bin/echo` into
# `$GITHUB_ENV` from the typecheck job's INSTALL step and `pnpm quality` prints its
# own command and exits 0 — the self-test never starts, the fan-in is handed
# `typecheck: success`, and nothing in the repository noticed. A checker that lives
# inside the thing it checks can always be switched off by switching that thing off.
#
# So every job below runs ONE step before anything else can touch its environment:
# right after `actions/checkout` (there is nothing to read before the checkout), and
# before any setup, install or `$GITHUB_ENV` write. It compares this file, byte for
# byte, against the sha256 committed in `.github/ci-workflow.lock`, using `cut`,
# `sha256sum` and shell builtins — no pnpm, no node, no python, all three of which
# read configuration out of an environment an earlier step is free to write.
#
# THE SAME STEP ALSO REFUSES TWO FILENAMES, AND IT IS A RATCHET RATHER THAN A BOUNDARY.
# Review of #874 r12 found that a project `.npmrc` holding `script-shell=/bin/echo`
# makes every `pnpm quality --leg …` print its own command and exit 0 — five green legs
# over zero gates, with no diff to this file, to the lock, or to any repository script.
# `.pnpmfile.cjs` is the same family: JavaScript that pnpm executes during install.
# Neither file exists in this repository today, so the tripwire refuses both by name, in
# a step that runs BEFORE pnpm is ever invoked.
#
# What that buys and what it does not: it closes ONE carrier that was demonstrated, and
# it leaves an author who adds either file exactly two options — edit this step and its
# hand-written copy in the self-test, in the same commit, which is a diff a reviewer
# reads; or leave all seven jobs red, which is not mergeable. It is not evidence that
# the carriers have been enumerated. They have not been; see below.
#
# IT RUNS UNDER `shell: sh`, AND THAT FIELD IS LOAD-BEARING. r8's review found the
# step was still being STARTED by a shell that reads a startup file named in its own
# environment: with `BASH_ENV: <path>` at workflow level, bash sources that path
# before the first line of `run:` — early enough to rewrite the lock on disk, or to
# define functions called `cut` and `sha256sum` that agree with whatever it is
# handed. The body being minimal never protected it; the body had not started yet.
# A non-interactive `sh` reads NEITHER `BASH_ENV` NOR `ENV` — dash on the runner,
# bash-as-sh on a laptop, both measured against a poison file that a `dash -i`
# control proves is readable (evidence in the r9 comment on #874). So the body below
# starts in an environment nothing in this file can pre-seed, and the self-test pins
# both the `shell: sh` field and the absence of `BASH_ENV`/`ENV` from every env block
# this workflow has.
#
# WHAT IT BUYS, EXACTLY: it makes "the workflow that ran" provably "the workflow that
# was reviewed". A ci.yml that is not the one `.github/ci-workflow.lock` pins fails
# this step in EVERY job, before a single gate, install or repository script has run.
# `scope` fails first, which leaves the five legs `skipped` and the required `quality`
# check RED — not mergeable. That covers deleting or neutering this very step in one
# job, because the other six still hash the whole file.
#
# WHAT IT IS NOT, AND WE ARE NOT GOING TO PRETEND OTHERWISE: it is not a wall around
# CI. Three rounds of review each falsified the round before's enumeration, and the
# PATTERN is what matters here, not the three individual holes:
#
#   r8   killed "a bypass has to touch this step or the lock file". A workflow-level
#        `BASH_ENV` touched neither: bash sources that file before the step's first
#        line, so it can rewrite the lock, or define `cut` and `sha256sum`.
#   r10  killed its replacement, "every bypass needs a diff to THIS FILE", with a
#        demonstration rather than an argument: the `scope` job runs
#        `bash scripts/ci/pr-scope.sh` AFTER the tripwire, so a diff to that ONE
#        REPOSITORY SCRIPT — no ci.yml, no lock — made it print `false`, all five legs
#        `skipped`, and the fan-in read the skips as a docs-only PR and went green.
#   r12  killed the one after that, "a diff to one of these seven files". A project
#        `.npmrc` holding `script-shell=/bin/echo` is none of the seven and changes no
#        line of any of them; every `pnpm quality --leg …` then prints its own command
#        and exits 0. Five green legs, a green `quality`, not one gate run.
#
# Three enumerations, three counter-examples, each one found OUTSIDE the enumeration it
# broke. The next carrier is not going to announce itself either, so THIS FILE NO LONGER
# MAKES AN ENUMERATION CLAIM.
#
# ── WHAT THE TRIPWIRE PROVES, AND WHAT NOTHING HERE PROVES ───────────────────
# PROVED, by machine, on every run:
#   - the ci.yml that RAN is the ci.yml that was committed — the digest comparison
#     above, in every job, before any setup, install or `$GITHUB_ENV` write;
#   - the named ratchets on the carriers review has actually found: `BASH_ENV` and
#     `ENV` appear in no `env:` block of this file at any depth (3d), the tripwire's
#     own `shell: sh` (3f), and — r12's carrier — no `.npmrc` and no `.pnpmfile.cjs`
#     in the checkout, refused by name in the tripwire body itself;
#   - each leg runs exactly `pnpm quality --leg <leg>`, package.json resolves that to
#     `bash scripts/ci/quality.sh`, and quality.sh's gate→leg map is compared against a
#     list written out by hand in the self-test (a deleted, renamed or relegged gate is
#     red there);
#   - the docs-only skip is re-derived by the fan-in itself, from the API, with a
#     filter written in THIS file, so a `pr-scope` that lies can make the legs RUN when
#     they need not have but cannot buy a skip.
#
# ONE ATTRIBUTION THAT USED TO BE STATED WRONG HERE, corrected in r13 because #874 r12
# caught the two halves of this repository contradicting each other: the self-test is
# itself one of quality.sh's gates, so DELETING THAT GATE LINE FROM quality.sh DELETES
# THE CHECKER, and the tripwire does not catch it — the tripwire hashes ci.yml, not
# quality.sh. The legs go green over a gate list nobody compared. What catches that is
# the diff to quality.sh, and nothing else. The self-test says the same thing in its own
# header, and docs/runbooks/local-ci.md says it a third time.
#
# NOT PROVED, and not provable from inside this repository: that no OTHER file in it
# can change how these checks execute. `BASH_ENV`, `pr-scope.sh` and `.npmrc` were each
# outside the list that preceded them; the carriers are an open set, and every sentence
# that has claimed otherwise here was falsified by the next round.
#
# SO WHAT ACTUALLY STOPS CI FROM BEING WEAKENED SILENTLY IS TWO THINGS, AND NEITHER IS
# A SCRIPT IN THIS REPOSITORY:
#   1. the `quality` required check in the protect-main ruleset, bypass_actors empty —
#      no run reports green without producing it;
#   2. human review of the PR diff. Every carrier above, and every carrier nobody has
#      named yet, is a CHANGE TO A FILE, and a change to a file is in the diff by
#      construction. That is the one property that does not depend on having guessed
#      the list right.
#
# ── FILES TO READ FIRST IN A DIFF THAT TOUCHES CI ────────────────────────────
# A reviewer's reading order, NOT a boundary and NOT a complete list. What these have
# in common is that changing them turns gates OFF, where changing a gate's own code
# makes it FAIL — quiet versus loud:
#
#     .github/workflows/ci.yml        this file: every job, step, env and condition
#     .github/ci-workflow.lock        the digest the tripwire compares this file to
#     scripts/ci/pr-scope.sh          run by `scope` below; decides the docs-only skip
#     scripts/ci/pr-scope.jq          the decision pr-scope.sh transports
#     scripts/ci/quality.sh           what `pnpm quality --leg …` resolves to
#     package.json                    the `quality` script that does the resolving
#     scripts/ci/ci-workflow-lock.sh  writes the lock (this workflow never runs it)
#     .npmrc, .pnpmfile.cjs           absent today; the tripwire is red if either appears
#
# The `scripts/ci/…` rows are machine-checked rather than asserted: the self-test scans
# every `run:` script in this file for `scripts/…` paths and requires the set to be
# exactly the one written out by hand there, so a call to a script nobody named is red.
# Read what that check does and does not say: it says the list covers what THIS FILE
# RUNS. It says nothing about what pnpm, node or the runner read on their own — which
# is exactly where r12's `.npmrc` came from. See docs/runbooks/local-ci.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # Pre-wiring for a merge queue, which is the natural next step once `quality`
  # finishes in minutes: GitHub runs the queued batch under `merge_group`, and a
  # required check that never fires on that event would deadlock the queue. There
  # is no PR in a merge-group context, so the scope job cannot ask which files
  # changed — it runs every gate. Fail-safe by construction: the only thing lost
  # is the docs-only short-circuit, on an event nobody has enabled yet.
  merge_group:

# `pull-requests: read` is for the docs-only scope check below (it lists the PR's files).
permissions:
  contents: read
  pull-requests: read

# `github.ref` is the fallback for merge_group, where there is no PR number: without
# it every merge-group run would share one concurrency group and cancel the others.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workflow-level, so the five legs cannot drift apart. A leg quietly running with a
# different DATABASE_URL or a different heap ceiling than its siblings would be a
# gate checking something other than what it claims.
env:
  # `next build` re-runs a TypeScript pass in a child worker, and that worker had grown to
  # the ~2 GB default heap: it now OOMs on a coin flip, independently of what a PR changed
  # (measured: 11 MB added to a 1,088 MB `tsc` run — under 1%). Raising the ceiling weakens
  # no gate; the check still runs, and `pnpm -r typecheck` runs before it.
  NODE_OPTIONS: --max-old-space-size=6144
  # The service container each leg declares. quality.sh only uses this as the
  # maintenance connection; the run itself happens on a per-run database it creates
  # and force-drops (name ends in _test, enforced there). Every leg gets its own
  # Postgres and its own database, so no leg can see another's rows.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fikirtive_test
  BETTER_AUTH_SECRET: fikirtive-ci-only-session-secret-not-for-production
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: fikirtive-ci-only-google-client
  GOOGLE_CLIENT_SECRET: fikirtive-ci-only-google-secret

jobs:
  # ── the docs-only decision, unchanged (#809) ─────────────────────────────────
  # Docs-only PRs have nothing for these gates to check. This is deliberately NOT a
  # workflow-level `paths-ignore`: a workflow skipped by a path filter never posts its
  # check, and `quality` is required — a docs-only PR would sit unmergeable forever.
  # Deciding inside the workflow means `quality` still reports on every PR, it just
  # finishes in seconds. Fail-safe: anything unexpected (API error, empty list, no PR
  # in context) runs the full gate.
  #
  # It is its own job now only because five legs have to read one answer. The step
  # inside it is the same step, and the decision still lives in scripts/ci/pr-scope.jq,
  # covered by scripts/__tests__/pr-scope.test.sh, which the `typecheck` leg runs.
  scope:
    name: scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Three outputs, not one. `code` is what the five legs are gated on and has not
    # changed. `reason` and `legs` are what this job TELLS the fan-in about its own
    # answer: which legs it means to run, and why. The fan-in refuses any combination
    # of the three that the step below cannot produce — a run whose scope job describes
    # itself in terms this workflow never writes is a run nobody here can explain.
    outputs:
      code: ${{ steps.scope.outputs.code }}
      reason: ${{ steps.scope.outputs.reason }}
      legs: ${{ steps.scope.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      # THE TRIPWIRE (see the note at the top of this file). Byte-identical in every
      # job on purpose: scripts/__tests__/quality-legs.test.sh holds one hand-written
      # copy of these lines and requires every job's step #2 to be exactly it —
      # `shell: sh` included, because that field is what stops a startup file named
      # in this workflow's own environment (`BASH_ENV`, `ENV`) from running first.
      # The `.npmrc`/`.pnpmfile.cjs` loop is r12's carrier, ratcheted shut by name.
      - name: ci.yml is the reviewed one
        shell: sh
        run: |
          set -eu
          want="$(cut -d' ' -f1 .github/ci-workflow.lock)"
          got="$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)"
          [ ${#want} -eq 64 ] || { echo "ci-guard: .github/ci-workflow.lock does not hold one sha256 digest"; exit 1; }
          [ "$want" = "$got" ] || { echo "ci-guard: ci.yml is $got, .github/ci-workflow.lock pins $want. If the change to ci.yml was intended, regenerate the lock in the SAME commit: bash scripts/ci/ci-workflow-lock.sh"; exit 1; }
          for f in .npmrc .pnpmfile.cjs apps/*/.npmrc apps/*/.pnpmfile.cjs packages/*/.npmrc packages/*/.pnpmfile.cjs; do
            [ ! -e "$f" ] || { echo "ci-guard: $f is in this checkout, and pnpm reads it before any gate does. #874 r12: 'script-shell=/bin/echo' in .npmrc makes every 'pnpm quality --leg <leg>' print its own command and exit 0, and .pnpmfile.cjs is JavaScript pnpm runs during install. Neither file existed when this ratchet was written. If adding one is intended, say so by editing this step in ci.yml AND its hand-written copy in scripts/__tests__/quality-legs.test.sh, in the SAME commit."; exit 1; }
          done
          echo "ci-guard: ci.yml matches .github/ci-workflow.lock ($got), and no .npmrc/.pnpmfile.cjs is in this checkout"

      # This step does no interpretation at all: it saves both API responses verbatim
      # and forwards the answer.
      #
      # Saving them verbatim is the point. Four review rounds of #809 each found another
      # input that survived a text projection and came out the other side as a WRONG
      # "docs-only" — a green `quality` over unreviewed code. So no `--jq` shaping here;
      # jq parses GitHub's own JSON, where a newline in a path is just a character, a
      # rename's old name is a field, and an illegal escape is a parse error.
      #
      # Two responses, not one: the file list, and the PR object. The files endpoint stops
      # at 3,000 entries without saying so, so the PR's own `changed_files` is what proves
      # the list is whole.
      #
      # `set -e` matters here and is not redundant with the `|| code=true` fallbacks. The
      # fallbacks absorb the failures we predicted — the two `gh` calls and pr-scope.sh
      # itself — and turn each into "run every gate". `set -e` covers everything we did not
      # predict, and above all the write to $GITHUB_OUTPUT: without it, a failed write left
      # the step green with no `code` output at all, which the old `== 'true'` conditions
      # downstream read as "skip". Now that write failing fails the step, a failed step
      # fails this job, and the fan-in below turns a failed scope job into a failed
      # `quality`. Merge blocked, which is the safe direction.
      #
      # The PR number arrives as an environment variable rather than a `${{ }}` splice into
      # the script body, because on `merge_group` there is no PR and the empty case has to
      # be a value this script can test, not a hole in its source text.
      - name: Scope — does this PR touch anything outside docs/?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # One writer for all three outputs, so this job cannot publish a `code` its
          # `reason` contradicts, or a `legs` its `code` contradicts. The fan-in checks
          # the three against each other; that check is only worth making because they
          # are written here, together, once.
          emit() { # <code> <reason>
            legs=all
            if [ "$1" = "false" ]; then legs=none; fi
            {
              echo "code=$1"
              echo "reason=$2"
              echo "legs=$legs"
            } >> "$GITHUB_OUTPUT"
            echo "scope: code=$1, legs=$legs, reason=$2"
          }
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "no pull request in this context (event: $EVENT_NAME) — running every gate"
            emit true no-pr-context
            exit 0
          fi
          files_json="${RUNNER_TEMP:-/tmp}/pr-files.json"
          pr_json="${RUNNER_TEMP:-/tmp}/pr-object.json"
          pr="repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          gh api --paginate --slurp "$pr/files" >"$files_json" 2>/dev/null || : >"$files_json"
          gh api "$pr" >"$pr_json" 2>/dev/null || : >"$pr_json"
          if [ ! -s "$files_json" ] || [ ! -s "$pr_json" ]; then
            echo "could not read the PR from the API — running every gate"
            emit true api-unreadable
            exit 0
          fi
          echo "changed paths (name, then previous name for renames):"
          jq -r '.[][] | "  " + (.filename|tojson) + (if .previous_filename == null then "" else "  <- " + (.previous_filename|tojson) end)' \
            "$files_json" 2>/dev/null || echo "  (unparseable — pr-scope will fail closed)"
          # Same polarity as ever: only the one string this script writes on purpose
          # buys a skip. A non-zero exit, an empty answer, or any word nobody
          # anticipated all land on "run every gate".
          code="$(bash scripts/ci/pr-scope.sh "$files_json" "$pr_json")" || code=nonzero-exit
          case "$code" in
            false)
              echo "docs/** only, and the file list is provably complete — every gate below is a no-op"
              emit false docs-only
              ;;
            true) emit true outside-docs ;;
            *) emit true scope-script-failed ;;
          esac

  # ── the five legs ────────────────────────────────────────────────────────────
  # Same `if:` on all five. Polarity is deliberate and identical to what the old
  # single job used: `!= 'false'` and never `== 'true'`. Only the one string the scope
  # step writes on purpose buys a skip; a missing output, an empty output, or any value
  # nobody anticipated all land on "run the gate". A scope job that FAILS skips the legs
  # entirely — and the fan-in treats that as a failure, not as a pass.
  #
  # Why these five. The fan-in waits for the SLOWEST leg, so the split is worth exactly
  # what its longest leg costs — legs under that floor are free, legs over it are the
  # whole bill. Every green run of this split so far, not the best one:
  #
  #                  31513415188  31514708207  31519940167  31659224453
  #   tests                 500s         454s         746s         475s   ← THE FLOOR
  #   build                 220s         190s         191s         207s
  #   typecheck             206s         162s         163s         154s
  #   lint                  149s         142s         147s         151s
  #   checks                116s         104s         100s         108s
  #   scope                   7s           7s          11s           9s
  #   WALL CLOCK            519s         472s         767s         495s
  #
  # So: about 8 to 13 minutes, and PLAN FOR 13 — the old single job was ~18-20 min, so
  # the split is worth having even on its worst run, but quoting the 8-minute one as
  # "the number" would be quoting a coin flip. All of the spread is `tests`: it ranged
  # 454-746s (+64%) across runs of the same branch, while every other leg stayed inside
  # ±15%. `pnpm -r test` is ONE gate and cannot be divided without changing what a gate
  # is, so nothing here gets faster — or steadier — than that suite does. It has a leg
  # to itself so that when it swings, it swings alone.
  #
  # Each leg's number already includes the packages build it pays for itself
  # (`packages/*/dist` + the generated Prisma client are the prerequisite for everything
  # downstream) — that duplication is why five legs cost more RUNNER time (1,064-1,362s
  # measured) than one job while costing far less WALL time, and runner time on per-PR
  # ephemeral VMs is the cheap axis.
  #
  # The slack under the floor is also the answer to "why not ten legs": with `tests` at
  # 450-750s, a sixth leg carved out of the other four would shave nothing off the wall
  # clock and would pay another packages build.
  #
  # Every leg declares Postgres even where its gates never query it. quality.sh takes one
  # path — machine lock, per-run database, force-drop on exit — for local runs and for CI
  # alike, and a leg that quietly skipped part of that preamble would be a second path to
  # keep honest. A container that starts and is never used costs seconds on a leg that is
  # not the critical path; it buys one code path.

  typecheck:
    name: typecheck
    needs: scope
    if: needs.scope.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fikirtive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # THE TRIPWIRE (see the note at the top of this file). Byte-identical in every
      # job on purpose: scripts/__tests__/quality-legs.test.sh holds one hand-written
      # copy of these lines and requires every job's step #2 to be exactly it —
      # `shell: sh` included, because that field is what stops a startup file named
      # in this workflow's own environment (`BASH_ENV`, `ENV`) from running first.
      # The `.npmrc`/`.pnpmfile.cjs` loop is r12's carrier, ratcheted shut by name.
      - name: ci.yml is the reviewed one
        shell: sh
        run: |
          set -eu
          want="$(cut -d' ' -f1 .github/ci-workflow.lock)"
          got="$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)"
          [ ${#want} -eq 64 ] || { echo "ci-guard: .github/ci-workflow.lock does not hold one sha256 digest"; exit 1; }
          [ "$want" = "$got" ] || { echo "ci-guard: ci.yml is $got, .github/ci-workflow.lock pins $want. If the change to ci.yml was intended, regenerate the lock in the SAME commit: bash scripts/ci/ci-workflow-lock.sh"; exit 1; }
          for f in .npmrc .pnpmfile.cjs apps/*/.npmrc apps/*/.pnpmfile.cjs packages/*/.npmrc packages/*/.pnpmfile.cjs; do
            [ ! -e "$f" ] || { echo "ci-guard: $f is in this checkout, and pnpm reads it before any gate does. #874 r12: 'script-shell=/bin/echo' in .npmrc makes every 'pnpm quality --leg <leg>' print its own command and exit 0, and .pnpmfile.cjs is JavaScript pnpm runs during install. Neither file existed when this ratchet was written. If adding one is intended, say so by editing this step in ci.yml AND its hand-written copy in scripts/__tests__/quality-legs.test.sh, in the SAME commit."; exit 1; }
          done
          echo "ci-guard: ci.yml matches .github/ci-workflow.lock ($got), and no .npmrc/.pnpmfile.cjs is in this checkout"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypeScript's incremental state for `tsc --noEmit` over apps/web. tsc re-checks
      # any file whose hash moved plus everything downstream of it, so a cache restored
      # from another commit weakens nothing — it only skips re-deriving types for files
      # that did not change. ~1 MB, so the restore is nearly free. The `github.sha`
      # suffix makes every run save a fresh entry; the restore-keys load one.
      #
      # Measured, so nobody has to guess: the saving tracks how much of the diff the
      # restored state still covers. Restoring across a large diff bought nothing
      # (typecheck 86s → 86s); across a one-comment diff it cut typecheck 86s → 49s. So
      # expect real savings on push-after-push of the same branch, none on a fresh one.
      #
      # Separate from the `build` leg's cache on purpose: two parallel jobs writing one
      # cache key means one loses the race and warns, and neither leg produces the
      # other's artifact anyway.
      - name: Restore the tsc incremental state
        uses: actions/cache@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
            tsbuildinfo-${{ runner.os }}-node22-
      # quality.sh's machine-wide mutex still runs on every leg; on an ephemeral VM it
      # acquires instantly and serializes nothing — it exists for shared machines (dev
      # laptops, the fallback self-hosted runner) and is harmless here.
      - run: pnpm quality --leg typecheck

  tests:
    name: tests
    needs: scope
