  # ── the fan-in ───────────────────────────────────────────────────────────────
  # The `quality` context is the required status check in the protect-main ruleset
  # (bypass_actors is empty — nobody can merge around it). Renaming this job, or letting
  # it be skipped when it should not be, freezes every merge in the repository. The name
  # is byte-identical to what it always was; only what stands behind it changed, from one
  # job running five kinds of check to five jobs running them at once.
  #
  # It runs under `always()` because its whole purpose is to have an opinion about legs
  # that did NOT succeed — without it, a failed leg would simply skip this job and
  # `quality` would never report at all, which reads as "still running", not "failed".
  # `always()` also means it must re-derive the draft condition for itself; every other
  # job inherits that through `needs`.
  quality:
    name: quality
    needs: [scope, typecheck, tests, build, lint, checks]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # THE TRIPWIRE (see the note at the top of this file). Byte-identical in every
      # job on purpose: scripts/__tests__/quality-legs.test.sh holds one hand-written
      # copy of these lines and requires every job's step #2 to be exactly it —
      # `shell: sh` included, because that field is what stops a startup file named
      # in this workflow's own environment (`BASH_ENV`, `ENV`) from running first.
      # The `.npmrc`/`.pnpmfile.cjs` loop is r12's carrier, ratcheted shut by name.
      - name: ci.yml is the reviewed one
        shell: sh
        run: |
          set -eu
          want="$(cut -d' ' -f1 .github/ci-workflow.lock)"
          got="$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)"
          [ ${#want} -eq 64 ] || { echo "ci-guard: .github/ci-workflow.lock does not hold one sha256 digest"; exit 1; }
          [ "$want" = "$got" ] || { echo "ci-guard: ci.yml is $got, .github/ci-workflow.lock pins $want. If the change to ci.yml was intended, regenerate the lock in the SAME commit: bash scripts/ci/ci-workflow-lock.sh"; exit 1; }
