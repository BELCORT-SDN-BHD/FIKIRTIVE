            [ ! -e "$f" ] || { echo "ci-guard: $f is in this checkout, and pnpm reads it before any gate does. #874 r12: 'script-shell=/bin/echo' in .npmrc makes every 'pnpm quality --leg <leg>' print its own command and exit 0, and .pnpmfile.cjs is JavaScript pnpm runs during install. Neither file existed when this ratchet was written. If adding one is intended, say so by editing this step in ci.yml AND its hand-written copy in scripts/__tests__/quality-legs.test.sh, in the SAME commit."; exit 1; }
          done
          echo "ci-guard: ci.yml matches .github/ci-workflow.lock ($got), and no .npmrc/.pnpmfile.cjs is in this checkout"

      # ── THE SECOND OPINION (the r10 P0) ──────────────────────────────────────
      # The verdict below used to accept "all five legs skipped" on the `scope` job's
      # word alone. r10 showed what that word is worth: `scope` reaches its answer by
      # running `bash scripts/ci/pr-scope.sh`, a REPOSITORY SCRIPT, after the tripwire
      # has already passed. Edit that one file to print `false` — no ci.yml diff, no
      # lock diff, nothing for the tripwire to notice — and every gate in this workflow
      # is skipped while `quality` reports green.
      #
      # So the skip is no longer taken on trust. This step asks GitHub the same two
      # questions the scope job asked, in ITS OWN job, and decides for itself with a
      # filter written in THIS file, which the lock pins and the self-test writes out a
      # second time by hand. It runs NO repository script: `gh` and `jq` are on the
      # runner image, and that is the whole dependency list.
      #
      # The two answers are compared one-directionally, and that asymmetry is the
      # design rather than an oversight:
      #
      #   scope says docs-only, this step disagrees  → RED. The legs were skipped on
      #                                                an answer this job cannot
      #                                                reproduce.
      #   scope says run everything, this step says
      #   docs-only                                  → green if the legs passed. The
      #                                                legs RAN; there is no unrun gate
      #                                                to hide. Failing here would only
      #                                                punish the scope job's own
      #                                                fail-closed paths (an API blip
      #                                                makes it answer "run everything",
      #                                                which is correct behaviour).
      #
      # Which is the honest statement of what this buys: a lying `pr-scope` can now only
      # cost CI minutes. It cannot buy a skip. The two files it is checking are not
      # thereby "verified" — they are demoted out of the decision.
      #
      # AND IT IS DELIBERATELY STEP #3. This job has no setup and no install: its steps
      # are the checkout, the tripwire (`shell: sh`, writes nothing), this, and the
      # verdict. So nothing in the repository has had an opportunity to write
      # `$GITHUB_ENV` or `$GITHUB_PATH` before this step's shell starts — which is the
      # r6 hole, and it is closed here by there being no step that could open it rather
      # than by a check. The position is pinned by hand in
      # scripts/__tests__/quality-legs.test.sh (3g), because "step #3" is the whole of
      # that argument.
      #
      # THIS FILTER IS A SECOND IMPLEMENTATION, NOT A SECOND CALL. Handing the same
      # scripts/ci/pr-scope.jq the same bytes would agree with itself by construction,
      # which is the shape r10 found and the shape this whole PR keeps re-learning. It
      # is deliberately the SIMPLER of the two, because it answers a narrower question:
      # pr-scope.jq must be right in both directions (a wrong `true` costs 13 minutes on
      # every docs PR), while this one only has to be right about refusing — anything it
      # cannot prove is `outside-docs`, and `outside-docs` merely means the legs had to
      # run. Where the two disagree about a legal-but-odd payload, this one goes red and
      # the answer is a re-run, not a merged gate.
      - name: Decide for ourselves whether this PR is docs-only
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          emit() { # <code> <reason>
            { echo "code=$1"; echo "reason=$2"; } >> "$GITHUB_OUTPUT"
            echo "recheck: code=$1, reason=$2"
          }
          if [ -z "${PR_NUMBER:-}" ]; then
            emit true no-pr-context
            exit 0
          fi
          files_json="${RUNNER_TEMP:-/tmp}/recheck-files.json"
          pr_json="${RUNNER_TEMP:-/tmp}/recheck-pr.json"
          pr="repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          # Three tries before giving up, which the scope job does not need and this
          # step does. There, an unreadable API means "run every gate" and the run is
          # merely slow; here it means the legs are already skipped and the only honest
          # answer left is RED. A transient blip should not be a red docs-only PR.
          fetch() { # <destination> <gh api arguments…>
            dest="$1"
            shift
            n=1
            while [ "$n" -le 3 ]; do
              if gh api "$@" >"$dest" 2>/dev/null; then return 0; fi
              n=$((n + 1))
              if [ "$n" -le 3 ]; then sleep 2; fi
            done
            : >"$dest"
          }
          fetch "$files_json" --paginate --slurp "$pr/files"
          fetch "$pr_json" "$pr"
          if [ ! -s "$files_json" ] || [ ! -s "$pr_json" ]; then
            emit true api-unreadable
            exit 0
          fi
          # Written to a file and read back with `jq -f`, not built with `$(cat <<…)`:
          # bash 3.2 (what macOS ships, and what the drill that lifts this program runs
          # under) mis-parses a here-document nested inside a command substitution when
          # the body holds an odd number of quote characters.
          filter="${RUNNER_TEMP:-/tmp}/recheck.jq"
          cat >"$filter" <<'RECHECK_JQ'
          # docs-only, proved from the API payloads, or one of the two ways of not
          # proving it. Never "tolerant": every branch that is not a proof lands on a
          # word that means the legs had to run.
          def known_status:
            . == "added" or . == "removed" or . == "modified" or . == "renamed"
            or . == "copied" or . == "changed" or . == "unchanged";
          def under_docs:
            type == "string"
            and startswith("docs/")
            and (explode | any(. == 0) | not)
            and (split("/") | all(length > 0 and . != "." and . != ".."));
          # A rename is two paths. Taking only `filename` is how a code file renames
          # itself into docs/ and takes every gate with it.
          def entry_is_docs_only:
            (.filename | under_docs)
            and (.status | known_status)
            and (if .status == "renamed" or .status == "copied"
                 then (.previous_filename | under_docs)
                 elif has("previous_filename") and .previous_filename != null
                 then (.previous_filename | under_docs)
                 else true
                 end);
          (if ($files[0] | type) == "array" and ($files[0] | all(type == "array"))
           then ($files[0] | add // [])
           else null
           end) as $entries
          | (if ($pr | length) == 1 and ($pr[0] | type) == "object"
             then $pr[0].changed_files
             else null
             end) as $total
          | if $entries == null then "undecidable"
            # An empty list means we never learned what changed, not that nothing did.
            elif ($entries | length) == 0 then "undecidable"
            elif ($entries | any(type != "object")) then "undecidable"
            elif ($total | type) != "number" then "undecidable"
            # As TEXT: jq keeps the fractional literal, so 1.0 and 1e-1 are visible here.
            elif ($total | tostring | test("^(0|[1-9][0-9]*)$") | not) then "undecidable"
            # GET .../files stops at 3,000 entries without saying so.
            elif $total >= 3000 then "undecidable"
            # Below that ceiling the count is what proves we read the whole PR — and it
            # only proves it if the entries are distinct.
            elif ($entries | length) != $total then "undecidable"
            elif ($entries | map(.filename) | unique | length) != ($entries | length) then "undecidable"
            elif ($entries | all(entry_is_docs_only)) then "docs-only"
            else "outside-docs"
            end
          RECHECK_JQ
          verdict="$(jq -r -n --slurpfile files "$files_json" --slurpfile pr "$pr_json" -f "$filter" 2>/dev/null)" || verdict=""
          case "$verdict" in
            docs-only) emit false docs-only ;;
            outside-docs) emit true outside-docs ;;
            *) emit true undecidable ;;
          esac

      # Fail closed, stated positively: this step names the ONE outcome that passes and
      # rejects everything else, rather than listing the outcomes that fail. A status
      # nobody anticipated — a new GitHub result string, a leg that vanished from this
      # file, an infrastructure abort, a cancellation — lands on "not the expected
      # value", which blocks the merge. Same polarity rule the scope check uses
      # (`!= 'false'`, never `== 'true'`), one level up.
      #
      # The expected outcome depends on the scope answer this run's legs were themselves
      # gated on — and, since r10, on whether the step above could reproduce it:
      #   scope is anything but success        → fail, whatever the legs say
      #   scope's three outputs do not agree   → fail; that run is not one this
      #                                          workflow's scope job can produce
      #   the recheck did not answer           → fail; the second opinion is not optional
      #   scope says code != 'false'           → every leg must be `success`
      #   scope says code == 'false' AND the
      #   recheck agrees                       → every leg must be `skipped`
      #   scope says code == 'false' and the
      #   recheck does NOT agree               → fail: the legs were skipped on an
      #                                          answer derived by a repository script
      #                                          that this job cannot reproduce
      # Both leg directions are strict equality on purpose. The legs read the same output
      # from the same job as this step does, so a leg that ran while the scope said
      # docs-only (or the reverse) means the two sides disagree about what this run was —
      # and a run we cannot explain is not a run that may merge.
      #
      # WHAT IS CHECKED IS AN IDENTITY, NOT A COUNT. The first version of this step
      # folded the five results into one blob of "name result" lines, counted the
      # lines, and passed on "five lines, all success". Review (#874) showed two
      # wrong PASSes that shape makes expressible: a rogue job standing in for a
      # missing `checks`, and `lint` wired in twice while `checks` was absent — in
      # both, the required `quality` check goes green while a gate never reported at
      # all. Five fixed identities, each read from its own variable, cannot express
      # either: there is no line to add, and nothing except `checks` can ever answer
      # for `checks`. A count would now be redundant, and is gone.
      - name: Every leg must have passed — or been skipped for a PR this job proved docs-only
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          SCOPE_LEGS: ${{ needs.scope.outputs.legs }}
          # From the step above, in this job — not from `needs`. This is the answer no
          # repository script had a hand in.
          RECHECK_CODE: ${{ steps.recheck.outputs.code }}
          RECHECK_REASON: ${{ steps.recheck.outputs.reason }}
          # Exactly one variable per declared leg, named after that leg, fed by that
          # leg's own job — machine-checked, both directions, by
          # scripts/__tests__/quality-legs.test.sh: a leg with no variable, a
          # variable with no leg, a duplicate, or a variable wired to the wrong job
          # all fail that gate.
          LEG_RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          LEG_RESULT_TESTS: ${{ needs.tests.result }}
          LEG_RESULT_BUILD: ${{ needs.build.result }}
          LEG_RESULT_LINT: ${{ needs.lint.result }}
          LEG_RESULT_CHECKS: ${{ needs.checks.result }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "scope: $SCOPE_RESULT (expected success)"
            echo ""
            echo "quality: the scope job did not succeed, so nothing below can be trusted — failing closed."
            exit 1
          fi

          # The scope job describes itself in three outputs written by one function, so
          # only five triples can come out of it. Anything else means the run was not
          # produced by the scope job in this file, and there is nothing here that could
          # honestly interpret it.
          case "${SCOPE_CODE:-}|${SCOPE_REASON:-}|${SCOPE_LEGS:-}" in
            'false|docs-only|none') ;;
            'true|outside-docs|all') ;;
            'true|no-pr-context|all') ;;
            'true|api-unreadable|all') ;;
            'true|scope-script-failed|all') ;;
            *)
              echo "scope published code=${SCOPE_CODE:-<empty>}, reason=${SCOPE_REASON:-<empty>}, legs=${SCOPE_LEGS:-<empty>}"
              echo ""
              echo "quality: that is not a combination the scope job in this workflow can publish — failing closed."
              exit 1
              ;;
          esac

          # And the second opinion has to BE one. A missing answer here is the step
          # above deleted, skipped or broken — never a licence to fall back on the
          # scope job's word, which is exactly what r10 exploited.
          case "${RECHECK_CODE:-}" in
            true|false) ;;
            *)
              echo "this job's own scope decision came back as '${RECHECK_CODE:-<empty>}'"
              echo ""
              echo "quality: the step that re-derives this PR's scope did not answer — failing closed."
              exit 1
              ;;
          esac

          if [ "$SCOPE_CODE" = "false" ]; then
            # THE r10 GATE. The legs are already skipped by the time this runs; the only
            # question left is whether anything other than a repository script says they
            # should have been.
            if [ "$RECHECK_CODE" != "false" ]; then
              echo "scope: docs/** only (reason: $SCOPE_REASON) — the five legs were skipped on that answer"
              echo "this job asked GitHub the same question and got: $RECHECK_CODE (reason: ${RECHECK_REASON:-<empty>})"
              echo ""
              echo "quality: the legs were skipped on a docs-only answer this job cannot reproduce."
              echo "  The scope job reaches that answer through scripts/ci/pr-scope.sh and"
              echo "  scripts/ci/pr-scope.jq; this job does not use either. Check what those two"
              echo "  files say in this PR's diff — failing closed."
              exit 1
            fi
            expected=skipped
            echo "scope: docs/** only, and this job re-derived that answer for itself — every leg must have been skipped"
          else
            expected=success
            echo "scope: code=$SCOPE_CODE (reason: $SCOPE_REASON) — every leg must have passed"
            if [ "$RECHECK_CODE" = "false" ]; then
              # The safe direction, and it is reported rather than punished: the legs
              # RAN. Making this red would only break the scope job's fail-closed paths,
              # where answering "run every gate" is the correct behaviour.
              echo "  (this job's own answer was docs-only; the gates ran anyway, which is the safe direction)"
            fi
          fi

          verdict=0

          # One named leg, one named variable, one comparison. `${VAR:-}` and never
          # `$VAR`: a leg cut out of the `needs` list above expands to nothing, and
          # "nothing" must read as a missing result and fail — not abort the shell
          # before the other four have been reported.
          leg_is() {
            if [ "$2" = "$expected" ]; then
              echo "  $1: $2"
            else
              echo "  $1: ${2:-<no result>} (expected $expected)"
              verdict=1
            fi
          }

          leg_is typecheck "${LEG_RESULT_TYPECHECK:-}"
          leg_is tests     "${LEG_RESULT_TESTS:-}"
          leg_is build     "${LEG_RESULT_BUILD:-}"
          leg_is lint      "${LEG_RESULT_LINT:-}"
          leg_is checks    "${LEG_RESULT_CHECKS:-}"

          # The other direction, and the reason the five comparisons above are not
          # the whole story: they prove every declared leg was judged, not that
          # nothing ELSE was wired in. A sixth job added to `needs` and to the
          # variables above — but not to the comparisons — would be a gate whose
          # result this step silently discards. Bash enumerates the variables by
          # prefix, so nothing here has to know what the environment holds; the
          # case arm is the same five identities once more, and mis-stating it
          # fails closed — a leg left out of it flags that leg's own variable.
          for leg_result_var in ${!LEG_RESULT_@}; do
            case "$leg_result_var" in
              LEG_RESULT_TYPECHECK|LEG_RESULT_TESTS|LEG_RESULT_BUILD|LEG_RESULT_LINT|LEG_RESULT_CHECKS) ;;
              *)
                echo "  $leg_result_var: answers for no leg this step judges"
                verdict=1
                ;;
            esac
          done

          if [ "$verdict" != "0" ]; then
            echo ""
            echo "quality: at least one leg is not $expected — failing closed."
            exit 1
          fi
          echo ""
          echo "quality: typecheck, tests, build, lint and checks are all $expected."
