name: agent-skills
on:
  pull_request:
    paths: ['.agents/**', '.claude/skills/**', 'scripts/sync-agent-skills.mjs', '.github/workflows/agent-skills.yml']
  push:
    branches: [main]
    paths: ['.agents/**', '.claude/skills/**', 'scripts/sync-agent-skills.mjs', '.github/workflows/agent-skills.yml']
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-agent-skills.mjs --check
